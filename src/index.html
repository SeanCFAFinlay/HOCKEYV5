<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover,interactive-widget=resizes-visual">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Hockey vs Soccer TD — PH Interactive Studios</title>

  <!-- Fonts preconnect + stylesheet for performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap">

  <!-- Three.js r128 with CDN fallback error notification -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    if (typeof THREE === 'undefined') {
      document.body.innerHTML = '<div style="color:#fff;background:#07090f;padding:24px;text-align:center;font-family:sans-serif"><h2>⚠️ Failed to load 3D engine</h2><p>Please check your internet connection and reload.</p><button onclick="location.reload()" style="margin-top:12px;padding:12px 24px;font-size:1rem;cursor:pointer;border-radius:8px;border:none">Reload</button></div>';
    }
    // Force-hide loader after 2s regardless of JS state
    setTimeout(function() {
      var l = document.getElementById('appLoader');
      if (l) l.style.display = 'none';
    }, 2000);
  </script>

  <!-- Loading indicator -->
  <style>
    #appLoader {
      position: fixed;
      inset: 0;
      background: #07090f;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      z-index: 9999;
      color: #fff;
      font-family: 'Rajdhani', sans-serif;
    }
    #appLoader.hidden { display: none; }

    .loader-logo {
      font-size: 1.2rem;
      letter-spacing: 6px;
      color: rgba(255,255,255,0.35);
      text-transform: uppercase;
      font-weight: 600;
    }

    .loader-logo span.ice  { color: #00d4ff; }
    .loader-logo span.sep  { color: rgba(255,255,255,0.2); margin: 0 6px; }
    .loader-logo span.soccer { color: #22c55e; }

    .loader-bar-wrap {
      width: 120px;
      height: 3px;
      background: rgba(255,255,255,0.08);
      border-radius: 2px;
      overflow: hidden;
    }
    .loader-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #00d4ff, #22c55e);
      border-radius: 2px;
      animation: loader-fill 1.2s cubic-bezier(0.4,0,0.2,1) forwards;
    }
    @keyframes loader-fill {
      0%   { width: 0%;   opacity: 1; }
      80%  { width: 88%;  opacity: 1; }
      100% { width: 100%; opacity: 0; }
    }
    .loader-spinner {
      width: 36px;
      height: 36px;
      border: 2.5px solid rgba(255,255,255,0.1);
      border-top-color: #00d4ff;
      border-right-color: #22c55e;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>

  <!-- CSS -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/screens.css">
  <link rel="stylesheet" href="css/hud.css">
  <link rel="stylesheet" href="css/tower-bar.css">
  <link rel="stylesheet" href="css/action-bar.css">
  <link rel="stylesheet" href="css/upgrade-sheet.css">
  <link rel="stylesheet" href="css/pause-sheet.css">
  <link rel="stylesheet" href="css/icons.css">
  <link rel="stylesheet" href="css/brand.css">
  <link rel="stylesheet" href="css/modals.css">
  <link rel="stylesheet" href="css/camera-btns.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/tooltips.css">
  <link rel="stylesheet" href="css/settings.css">
</head>
<body>

<!-- Loading Indicator -->
<div id="appLoader">
  <div class="brand-mark" data-brand></div>
  <div class="loader-spinner"></div>
  <div class="loader-logo">
    <span class="ice">Hockey</span>
    <span class="sep">vs</span>
    <span class="soccer">Soccer</span>
  </div>
  <div class="loader-bar-wrap">
    <div class="loader-bar"></div>
  </div>
</div>

<!-- Menu Screen -->
<div id="menuScreen" class="screen active">
  <div class="logo">
    <div class="logo-icons"><span data-icon="stick"></span><span data-icon="bolt"></span><span data-icon="ball"></span></div>
    <h1><span class="ice">HOCKEY</span> vs <span class="grass">SOCCER</span></h1>
    <p>TOWER DEFENSE 3D</p>
  </div>
  <div class="menu-cards" id="themeCards"></div>
  <div class="menu-footer">
    <div class="brand-credit" data-brand-small></div>
    <div class="version">v1.0</div>
  </div>
</div>

<!-- Map Selection Screen -->
<div id="mapScreen" class="screen">
  <div class="map-header">
    <button class="back-btn" onclick="showScreen('menuScreen')">‹</button>
    <h2 class="map-title" id="mapTitle">Select Arena</h2>
  </div>
  <div class="map-grid" id="mapGrid"></div>
</div>

<!-- Game Screen -->
<div id="gameScreen" class="screen">
  <div class="hud">
    <div class="hud-left">
      <button class="hud-menu" type="button" onclick="togglePauseMenu()" aria-label="Pause game"><span data-icon="pause"></span></button>
      <div class="hud-wave-group">
        <div class="hud-wave"><span class="hud-ic" data-icon="wave"></span> <span id="waveNum">0</span>/<span id="waveMax">20</span></div>
        <div class="hud-wave-theme" id="waveTheme"></div>
      </div>
    </div>
    <div class="hud-center">
      <div class="hud-stat enemies" id="enemyCounter"><span class="hud-ic" data-icon="enemies"></span><span id="enemyCount">0</span></div>
    </div>
    <div class="hud-right">
      <div class="hud-stat kills"><span class="hud-ic" data-icon="skull"></span><span id="killsVal">0</span></div>
      <div class="hud-stat money" id="moneyStat"><span class="hud-ic" data-icon="coin"></span><span id="moneyVal">500</span></div>
      <div class="hud-stat lives" id="livesStat"><span class="hud-ic" data-icon="heart"></span><span id="livesVal">20</span></div>
      <div class="hud-stat score"><span class="hud-ic" data-icon="star"></span><span id="scoreVal">0</span></div>
    </div>
  </div>

  <div class="canvas-wrap"></div>

  <!-- Wave preview panel (shown between waves) -->
  <div class="wave-preview" id="wavePreview" style="display:none">
    <div class="wp-header" id="wavePreviewHeader"></div>
    <div class="wp-body" id="wavePreviewBody"></div>
  </div>


  <div class="cam-btns">
    <button class="cam-btn" onclick="zoomIn()">+</button>
    <button class="cam-btn" onclick="zoomOut()">−</button>
    <button class="cam-btn" onclick="resetCam()">⟲</button>
  </div>

  <div class="bottom-ui">
    <div class="tower-bar" id="towerBar"></div>
    <!-- Two controls, not six. Speed cycles; SELL moved into the tower sheet
         and AUTO into the pause menu, leaving START the one primary action. -->
    <div class="action-bar">
      <button class="action-btn speed-btn" id="speedBtn" type="button" data-speed="1">1×</button>
      <button class="action-btn start-btn" id="startBtn" type="button" onclick="startWave()">▶ START</button>
    </div>
  </div>
</div>

<!-- Pause / overflow menu. Holds everything that does not earn a permanent place
     on a phone HUD: the secondary stats, auto-wave, settings, restart, exit. -->
<div class="pause-overlay" id="pauseOverlay" role="dialog" aria-modal="true" aria-labelledby="pauseTitle" hidden>
  <div class="pause-sheet">
    <h2 class="pause-title" id="pauseTitle">Paused</h2>
    <p class="pause-wave" id="pauseWave">Wave 0/20</p>

    <dl class="pause-stats">
      <div><dt>Kills</dt><dd id="pauseKills">0</dd></div>
      <div><dt>Score</dt><dd id="pauseScore">0</dd></div>
      <div><dt>Enemies</dt><dd id="pauseEnemies">0</dd></div>
    </dl>

    <button class="pause-row" type="button" id="pauseAutoBtn" role="switch" aria-checked="false">
      <span class="pause-row-label">
        Auto-start waves
        <small>Next wave begins on its own</small>
      </span>
      <span class="pause-switch" aria-hidden="true"></span>
    </button>

    <div class="pause-actions">
      <button class="pause-btn" type="button" onclick="openSettings()">Settings</button>
      <button class="pause-btn" type="button" id="pauseRestartBtn">Restart</button>
      <button class="pause-btn danger" type="button" id="pauseExitBtn">Exit to menu</button>
    </div>

    <button class="pause-resume" type="button" id="pauseResumeBtn">▶ Resume</button>
  </div>
</div>

<!-- Upgrade Sheet -->
<div class="upgrade-sheet" id="upgradeSheet">
  <div class="upgrade-handle"></div>
  <div class="upgrade-header">
    <div class="upgrade-icon" id="upIcon"></div>
    <div class="upgrade-info">
      <h3 id="upName">Tower</h3>
      <p id="upLevel">Level 1</p>
      <span class="upgrade-role" id="upRole">Fast</span>
    </div>
    <button class="upgrade-close" type="button" onclick="hideUpgrade()" aria-label="Close tower upgrade">×</button>
  </div>
  <div class="upgrade-stats">
    <div class="upgrade-stat"><div class="upgrade-stat-label">DMG</div><div class="upgrade-stat-value" id="upDmg">50</div><div class="upgrade-stat-next" id="upDmgNext">→75</div></div>
    <div class="upgrade-stat"><div class="upgrade-stat-label">RNG</div><div class="upgrade-stat-value" id="upRng">3.0</div><div class="upgrade-stat-next" id="upRngNext">→3.5</div></div>
    <div class="upgrade-stat"><div class="upgrade-stat-label">RATE</div><div class="upgrade-stat-value" id="upRate">1.0</div><div class="upgrade-stat-next" id="upRateNext">→1.2</div></div>
  </div>
  <div id="upgradePath" class="upgrade-path"></div>
  <div class="target-priority">
    <div class="target-priority-label">Target <span id="upPriorityLabel">First</span></div>
    <div class="priority-controls" id="priorityControls"></div>
  </div>
  <div class="upgrade-btns">
    <button class="upgrade-btn sell" onclick="sellTower()">Sell $<span id="upSell">60</span></button>
    <button class="upgrade-btn do-upgrade" id="upBtn" onclick="doUpgrade()">Upgrade $<span id="upCost">80</span></button>
  </div>
</div>

<!-- Win Modal -->
<div class="modal-overlay" id="winModal">
  <div class="modal win">
    <div class="modal-icon"><span data-icon="trophy"></span></div>
    <h2>VICTORY!</h2>
    <div class="modal-stats">
      <div><div class="modal-stat-val" id="winScore">0</div><div class="modal-stat-label">Score</div></div>
      <div><div class="modal-stat-val" id="winWaves">0</div><div class="modal-stat-label">Waves</div></div>
      <div><div class="modal-stat-val" id="winBest">—</div><div class="modal-stat-label">Best Score</div></div>
    </div>
    <div class="modal-btns">
      <button class="modal-btn secondary" onclick="closeModal('win')">Menu</button>
      <button class="modal-btn" onclick="replayGame()">Play Again</button>
    </div>
  </div>
</div>

<!-- Lose Modal -->
<div class="modal-overlay" id="loseModal">
  <div class="modal lose">
    <div class="modal-icon"><span data-icon="skull"></span></div>
    <h2>DEFEATED</h2>
    <div class="modal-stats">
      <div><div class="modal-stat-val" id="loseWave">0</div><div class="modal-stat-label">Wave</div></div>
      <div><div class="modal-stat-val" id="loseScore">0</div><div class="modal-stat-label">Score</div></div>
      <div><div class="modal-stat-val" id="loseBest">—</div><div class="modal-stat-label">Best Score</div></div>
    </div>
    <div class="modal-btns">
      <button class="modal-btn secondary" onclick="closeModal('lose')">Menu</button>
      <button class="modal-btn" onclick="replayGame()">Retry</button>
    </div>
  </div>
</div>

<!-- Main JS Module -->
<script type="module" src="js/main.js"></script>

</body>
</html>
